name: Auto-Compilar PS5 ELF

on:
  push:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
      - '.github/workflows/compilar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compilar el Payload con PS5 SDK
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work ghcr.io/ps5-payload-dev/pacman:latest /bin/bash -lc '
            pacman -Syu --noconfirm ps5-payload-sdk ps5-payload-curl
            export PS5_PAYLOAD_SDK=/opt/pacbrew/ps5/payload-sdk
            ln -sf /opt/pacbrew/ps5/payload-sdk /opt/ps5-payload-sdk
            make clean
            make
            chmod 666 *.elf
          '

      - name: Guardar el ELF en el repositorio y en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add *.elf
          if ! git diff --cached --quiet; then
            git commit -m "Auto-compilado PS5-AutoupdaterPM.elf"
            git push
          else
            echo "El archivo ELF en la rama principal ya estaba actualizado."
          fi

          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 PS5-AutoupdaterPM.elf --clobber
          else
            gh release create v1.0.0 PS5-AutoupdaterPM.elf --title "v1.0.0" --notes "Compilacion automatica de PS5-AutoupdaterPM.elf"
          fi
          
