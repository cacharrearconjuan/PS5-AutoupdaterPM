name: Compilar y publicar release

on:
  push:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/compilar.yml'
  workflow_dispatch:
    inputs:
      incremento:
        description: 'Qué número de versión subir (1.0.0 → minor = 1.1.0, patch = 1.0.1, major = 2.0.0)'
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write

# Nunca dos publicaciones a la vez: evita que dos ejecuciones calculen la misma versión
concurrency:
  group: release
  cancel-in-progress: false

env:
  SDK_VERSION: v0.44
  MBEDTLS_VERSION: 3.6.4
  CURL_VERSION: 8.18.0
  ELF: PS5-AutoupdaterPM.elf

jobs:
  compilar:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar el repositorio (con etiquetas)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Herramientas de compilación
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 lld-18
          echo "PS5_PAYLOAD_SDK=$HOME/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Caché del SDK + mbedTLS + curl
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/ps5-payload-sdk
          key: ps5sdk-${{ env.SDK_VERSION }}-mbedtls-${{ env.MBEDTLS_VERSION }}-curl-${{ env.CURL_VERSION }}-${{ hashFiles('scripts/build_deps.sh') }}

      - name: Instalar SDK y compilar dependencias
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: bash scripts/build_deps.sh

      - name: Calcular la nueva versión
        id: version
        env:
          INCREMENTO: ${{ inputs.incremento || 'minor' }}
        run: |
          ULTIMA=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$ULTIMA" ]; then
            NUEVA="1.0.0"
          else
            IFS=. read -r MA MI PA <<< "${ULTIMA#v}"
            case "$INCREMENTO" in
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              patch) PA=$((PA + 1)) ;;
              *)     MI=$((MI + 1)); PA=0 ;;
            esac
            NUEVA="$MA.$MI.$PA"
          fi
          if git rev-parse -q --verify "refs/tags/v$NUEVA" >/dev/null; then
            echo "::error::La etiqueta v$NUEVA ya existe"; exit 1
          fi
          echo "Anterior: ${ULTIMA:-ninguna}  →  Nueva: v$NUEVA"
          echo "nueva=$NUEVA" >> "$GITHUB_OUTPUT"
          echo "anterior=$ULTIMA" >> "$GITHUB_OUTPUT"

      - name: Compilar el payload
        run: |
          curl -fsSL -o cacert.pem https://curl.se/ca/cacert.pem
          make clean
          make VERSION=${{ steps.version.outputs.nueva }}
          file "$ELF" | tee /dev/stderr | grep -q 'ELF 64-bit' || { echo "::error::No es un ELF"; exit 1; }
          sha256sum "$ELF" | tee "$ELF.sha256"

      - name: Guardar el ELF como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: PS5-AutoupdaterPM-v${{ steps.version.outputs.nueva }}
          path: ${{ env.ELF }}
          if-no-files-found: error

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUEVA: ${{ steps.version.outputs.nueva }}
          ANTERIOR: ${{ steps.version.outputs.anterior }}
        run: |
          SHA=$(cut -d' ' -f1 "$ELF.sha256")
          {
            echo "Payload que descarga e instala la última versión de PS5 Payload Manager en \`/data/ps5_autoloader\`."
            echo
            echo "**SHA-256:** \`$SHA\`"
            echo
            if [ -n "$ANTERIOR" ]; then
              echo "### Cambios desde $ANTERIOR"
              git log --no-merges --pretty='- %s' "$ANTERIOR..HEAD"
            else
              echo "Primera versión."
            fi
          } > notas.md
          gh release create "v$NUEVA" "$ELF" \
            --target "$GITHUB_SHA" \
            --title "v$NUEVA" \
            --notes-file notas.md \
            --latest
